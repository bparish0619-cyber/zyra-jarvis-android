name: Build Debug APK

# Builds the debug APK in GitHub Actions (local Gradle builds do not
# work in Zyra's VM). Runs on every push to main and on manual dispatch.
# Mirrors Brandon's leica-looks-android workflow: temurin JDK 17, and no
# setup-android action (the runner image ships an SDK; the setup action
# breaks on current images).
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Make sure the platform and build-tools for compileSdk 35 exist
      # even if the runner image changes.
      - name: Install SDK packages
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "SDK platform 35 and build-tools 35.0.0 already present"
          else
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
            echo "Using $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Build debug APK
        # gradlew is committed without its executable bit (the push tool
        # stores every file as 100644), so restore it before running.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZyraJarvis-debug
          path: app/build/outputs/apk/debug/*.apk
